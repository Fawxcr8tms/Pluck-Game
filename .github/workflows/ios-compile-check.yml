name: iOS compile check

# Proves the iPhone app (including the Swift cut-out / WhatsApp / Back Tap code) builds,
# without an Apple Developer account: it builds for the Simulator with signing turned off.
on:
  push:
    branches: [claude/social-sticker-saver-app-ogqz9h]
    paths: ['mobile/**', '.github/workflows/ios-compile-check.yml']
  workflow_dispatch:

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS bundle + prebuild
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Dependency versions match the Expo SDK
        run: npx expo install --check
      - name: Bundle JS for iOS
        run: npx expo export --platform ios --output-dir /tmp/export
      - name: Generate native project (runs config plugins)
        run: npx expo prebuild --platform ios --no-install --clean

  ios:
    name: Xcode build (Simulator, unsigned)
    needs: js
    runs-on: macos-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - run: npm install --no-audit --no-fund
      - name: Prebuild + CocoaPods
        run: npx expo prebuild --platform ios --clean
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Pluck.xcworkspace -scheme Pluck -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee /tmp/xcodebuild.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" /tmp/xcodebuild.log
      - name: Verify Pluck's own native code is in the build
        run: |
          set -e
          # Diagnostics: every log line mentioning Pluck's code (shortened), as annotations readable from the API.
          grep -n -i -E "pluck(native|appintents)" /tmp/xcodebuild.log | cut -c1-300 | head -25 | sed 's/^/::notice title=log::/' || echo "::notice title=log::no lines mention PluckNative"
          grep -c "SwiftCompile" /tmp/xcodebuild.log | sed 's/^/::notice title=swiftcompile-lines::/' || true
          grep -m3 "SwiftCompile" /tmp/xcodebuild.log | cut -c1-300 | sed 's/^/::notice title=sample::/' || true
          grep -i "PluckNative" ios/Podfile.lock | head -5 | sed 's/^/::notice title=podfile.lock::/' || echo "::notice title=podfile.lock::PluckNative NOT in Podfile.lock"
          fail=0
          for f in PluckNativeModule.swift PluckAppIntents.swift; do
            if grep -q "$f" /tmp/xcodebuild.log; then echo "::notice title=compiled::$f was compiled"; else echo "::error title=missing::$f was NOT compiled"; fail=1; fi
          done
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/Pluck.app' -maxdepth 6 | head -1)
          echo "App: $APP"
          if [ -d "$APP/Metadata.appintents" ] && grep -rq "CutStickerIntent" "$APP/Metadata.appintents"; then
            echo "::notice title=shortcuts::'Cut Sticker with Pluck' is registered for the Shortcuts app"
          else
            echo "::error title=shortcuts::App Intent metadata missing: Shortcuts would not see the action"; fail=1
          fi
          grep -E "warning: .*(PluckNative|PluckAppIntents)" /tmp/xcodebuild.log | sed 's/^/::warning title=swift::/' | head -20 || true
          exit $fail
      - name: Show errors
        if: failure()
        run: grep -E -B2 -A6 "error:" /tmp/xcodebuild.log | head -300 || tail -200 /tmp/xcodebuild.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: xcodebuild-log, path: /tmp/xcodebuild.log }
